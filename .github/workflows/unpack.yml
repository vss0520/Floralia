name: Unpack Floralia

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack mod
        run: |
          mkdir extracted
          unzip -o floralia_fixed_v2.zip -d extracted

          MOD_DIR=$(dirname "$(find extracted -name mod.json -type f | head -n 1)")

          if [ -z "$MOD_DIR" ]; then
            echo "mod.json not found!"
            exit 1
          fi

          cp -a "$MOD_DIR"/. ./

          rm -rf extracted
          rm -f floralia_fixed_v2.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack Floralia mod"
          git push
